[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/centrevillage/onsalang"
rust-version = "1.85"

[workspace.dependencies]
onsa_diag = { path = "crates/onsa_diag" }
onsa_syntax = { path = "crates/onsa_syntax" }
onsa_sema = { path = "crates/onsa_sema" }
onsa_core = { path = "crates/onsa_core" }
onsa_interp = { path = "crates/onsa_interp" }
onsa_backend_c = { path = "crates/onsa_backend_c" }
onsa_backend_wasm = { path = "crates/onsa_backend_wasm" }
onsa_backend_js = { path = "crates/onsa_backend_js" }
onsa_driver = { path = "crates/onsa_driver" }
onsa_cli = { path = "crates/onsa_cli" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
# Every member depends on it: one feature set of the libraries in every command (X-22).
onsa_workspace_hack = { path = "crates/onsa_workspace_hack" }

[workspace.lints.clippy]
all = "warn"

# The dev profile, for fewer writes to the disk (X-16, 2026-10-26). Line tables
# only: a build from nothing took 1.9 GB of the disk with the full debug
# information, 1.6 GB without; a panic still names its file and line, and no
# debugger is used on these builds. No incremental compilation: its cache was
# most of the rest (a build from nothing is 0.8 GB without it), and a small
# edit rebuilds 1 to 1.5 s slower with 40 to 60 % fewer writes. Neither
# changes the generated code.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.release]
opt-level = 3

# One codegen unit for the interpreter: split into modules, its small helpers
# were no longer inlined across units (X-6, 2026-10-19: `onsa test` 4-5% slower,
# 599 -> 719 bytes of stack a call); with one unit both are back or better.
[profile.release.package.onsa_interp]
codegen-units = 1

# The interpreter is optimized a little in the dev profile too, for the
# stack: `onsa test` and the compile-time evaluation have one call depth
# limit (spec §12.5, S-222) in every build, and it must come before the
# safety net of the stack (R-05) also for a recursive call under the deepest
# nesting of expressions (S-183). A debug build without this does not fit;
# the numbers are measured in one place, the description of
# `onsa_interp::MAX_CALL_DEPTH`. `overflow-checks` and `debug-assertions`
# are the profile's and stay on. The guarantee in every environment (the
# evaluator keeps its own stack) is W9-03's.
[profile.dev.package.onsa_interp]
opt-level = 1

# The front end is optimized a little in the dev profile too, for the time of
# a check: every process that checks parses and analyzes the std again
# (W5-19, X-20), and the tools and the test cases start thousands of them.
# Measured on aarch64-apple-darwin (2026-11-05), before -> after, with
# `tools/compare.py speed all` over 3785 files: `check` 60.1 -> 24.8 s,
# `fmt --check` 13.7 -> 10.2 s, `dump --core` 12.4 -> 5.3 s; `onsa check` of an
# empty file 14.5 -> 5.9 ms. The build pays for it: after a touch of
# `onsa_sema` 5.2 -> 6.8 s, of `onsa_diag` 6.3 -> 8.7 s, and then
# `cargo test --workspace --no-run` 6.2 -> 11.9 s. The frames get smaller, so
# the stack is measured again (`onsa_diag::stack::STACK_SIZE`).
# `overflow-checks` and `debug-assertions` are the profile's and stay on.
[profile.dev.package.onsa_diag]
opt-level = 1

[profile.dev.package.onsa_syntax]
opt-level = 1

[profile.dev.package.onsa_sema]
opt-level = 1
