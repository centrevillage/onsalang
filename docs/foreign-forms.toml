# ---- flow の構文の誤り（W3-09、第 14 組）------------------------------------------------------------

# `if` / `match` の直後（同じ行）の空白の後の `~`（S-354、§2.6）。連鎖の頭の `if` と `match` だけが対象で、
# `else if` の後の `~` は `else_if_tilde`。候補の一つ目は空白を除く形。`~` が被演算子に接するときは、
# 前置の `~` の読み（`faust_bit_not` の候補そのもの）を二つ目に並べる。`if~c` は誤りでなく、fmt が
# `if~ c` にする。
[[form]]
id = "space_after_branch_keyword"
kind = "foreign"
origin = "C 系"
stage = "syntax"
code = "E0020"
spec = ["2.5", "2.6", "18.1"]
rule = "`if~` / `match~` は `if` / `match` の直後に空白を空けずに `~` を書く。ビット反転は前置の `!`"

[[form.example]]
source = '''
pub flow g(x: F32 at sample, c: Bool at sample) -> F32 at sample {
  let a = if ~ c { lp~(x) } else { x }
  a
}
'''
at = "2:14"
fixed = ['''
pub flow g(x: F32 at sample, c: Bool at sample) -> F32 at sample {
  let a = if~ c { lp~(x) } else { x }
  a
}
''']

[[form.example]]
source = '''
