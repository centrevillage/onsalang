# 既存言語と旧版の書き方の閉じた一覧（S-250）。
#
# 役割
#   仕様 §18.1 の E0020 の一覧を、機械が読む閉じた一覧にしたもの。基本仕様には表を置かず、このファイルが
#   一覧そのものである（S-250。§18.1 には置き場所と「一覧に無い形は一般の規則のコード」の一文だけがある）。
#   次の形が全て行になる:
#   - 既存言語と旧版の書き方（kind = "foreign"）: `&mut x`、`<T>`、経路の `::`、`;`、`i32`、`proc`、
#     空白の誤り、`@` 束縛、FAUST と C 系の書き方、など。
#   - 書き手の誤解を示す冗長な印（kind = "redundant"）: 定義済みの名前への `^`、フィールドの `pub`、
#     `@mem(fast)`、型の位置の `Buf::[F32]` の `::` など（P2）。
#   - 候補を作れないので E0002 と note にする既存言語の形（code = "E0002"）。
#   この表に無い形は E0020 にしない。その形を拒む一般の規則のコード（読めなければ E0002、名前が無ければ
#   E0302、など）で報告する。行は、決定（S-250 の付録 A の表、仕様の本文、各 S の決定）から足す。
#   仕様の本文に E0020 の文が無い形も、決定が行にしたものは行にする。
#   規則の表の実装（`onsa_syntax::foreign`）と、行の `id` で一対一に突き合わせる（自己テストは実装の票が書く。
#   判断を二か所に置かない、D-15）。
#
# 欄
#   [[form]]
#     id       snake_case。行の識別。実装の表の行と一対一で、ファイルの中で一意
#     kind     "foreign"（既存言語と旧版の書き方）| "redundant"（書き手の誤解を示す冗長な印）
#     origin   出自（人が読む。FAUST、Rust、C 系、C++、旧版など）
#     stage    検出の段（§18.1 の段の順）: "lexical" | "syntax" | "names" | "types" | "flow"。
#              "lexical" は字句の段で、構文の段の一部として fmt を止める（§18.2）。
#              後の段で出る行は、その段の診断のある単位の前の段の結果を前提にする
#     code     "E0020"（候補を作れる形）| "E0002"（候補を作れない形。Onsa での書き方を note で示す）
#     spec     拠る仕様の節（"2.5" の形）
#     rule     note が示す正しい規則の要約（note の文面は約束しないので比べない）
#
#   [[form.example]]（一つの行に一つ以上。文脈で候補が変わる形は例を分ける）
#     source     短い完全なファイル。誤りは一つ（S-236 の「唯一の誤り」の前提）。候補を当てた後も
#                同じ段以前の診断が出ないこと
#     at         主の位置 "<行>:<列>"（1 から。列は文字）。主の範囲は外来の形の範囲（形を作る最初のトークン
#                から最後のトークンまで）で、`at` はその始まり、形の最初のトークンである（S-316）:
#                `;`、`<`、`::`、`&`、型の名前、`+=`、`++`、`return`、`~`、`'`、`@`、`..`、ブロックコメントの `/*`。
#                呼び出しの形の誤り（`f(x)` の `f`、`s.f(x)` の `s`）は呼び出しの式の最初のトークン。
#                空白の誤りの位置は W3-06 で決める。書いていない例は位置を比べない
#     fixed      候補を順に一つずつ当てた後の全文。候補の数と並べ方も約束する。複数の候補の並べ方は
#                この表の例の候補の順が規範である（S-315）。code = "E0002" の行では書かない（候補なし）。
#                比べ方は `.fixK` と同じで、トークンと行の切れ目を比べ、空白の量と空行は比べない
#     property   仕様が候補の文字列を決めない形（S-247 の言葉の置き場所、S-253 の束縛の名前、S-250 の
#                タプル形の struct のフィールド名）は fixed を書かず、性質で約束する。意味は
#                `[[test.fix]]` と同じ: "clean"（当てた後の check が何も報告しない）、
#                "same_code"（コメントでないトークンの種類と字面と、それらの間の行の切れ目が、当てる前と
#                同じ。コメントは動いてよい）
#     candidates 性質だけで確かめる例で、候補の数を約束するとき（仕様が複数の候補を並べる形）
#
#   note の文面、title、編集の細かさ（S-251 で、変えるトークンだけを置き換える最小の編集）は、この表の
#   外で約束する（§18.1）。
#
# 行を足す手順
#   1. 決定（S-250 の付録 A の表、仕様の本文、各 S の決定）を確かめる。基本仕様の §18.1 は書き換えない。
#   2. この表に行と例を足す（仕様の節、段、規則、例を全て書く）。
#   3. 実装の規則の表（`onsa_syntax::foreign`）に同じ `id` の行を足す。通るまで、`tests/pending.toml` に
#      種類 "foreign-form"（target は行の `id`、until は通す作業）の項目を置く。
#   4. 事例の隣の `.fixK` や `[[test.fix]]` が要る形（文脈の組み合わせ）は、tests/spec/fixes/ に事例を置く。
#   5. 通ったら、実装待ちの項目を外す。

# ---- 文と項目の区切り ----------------------------------------------------------------------------

[[form]]
id = "semicolon"
kind = "foreign"
origin = "C 系"
stage = "syntax"
code = "E0020"
spec = ["2.5", "18.1"]
rule = "文と項目は改行で終わる。文と項目の区切りに `;` は使わない（`[e; N]` と `[T; N]` の `;` は配列の書き方の一部）"

[[form.example]]
source = '''
pub fn f() -> I32 {
  let a = 1;
  a
}
'''
at = "2:12"
fixed = ['''
pub fn f() -> I32 {
  let a = 1
  a
}
''']

# 同じ行に次の文が続くときは、`;` を除くだけでは一行に二つの文になる（E0002）。次の文を行頭に移す。
[[form.example]]
source = '''
pub fn f() -> I32 {
  let a = 1; let b = 2
  a + b
}
'''
at = "2:12"
fixed = ['''
pub fn f() -> I32 {
  let a = 1
  let b = 2
  a + b
}
''']

[[form.example]]
source = '''
const LIMIT: I32 = 4;

pub fn f() -> I32 {
  LIMIT
}
'''
at = "1:21"
fixed = ['''
const LIMIT: I32 = 4

pub fn f() -> I32 {
  LIMIT
}
''']

[[form.example]]
source = '''
pub fn f() -> I32 {
  1
};
'''
at = "3:2"
fixed = ['''
pub fn f() -> I32 {
  1
}
''']

# 続いた `;` は一つの構文の形で、一つの診断と一つの候補が全ての `;` を直す（S-248）。
[[form.example]]
source = '''
pub fn f() -> I32 {
  let a = 1;;
  a
}
'''
at = "2:12"
fixed = ['''
pub fn f() -> I32 {
  let a = 1
  a
}
''']

