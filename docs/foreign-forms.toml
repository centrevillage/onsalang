''']

# `else if` の後の `~`（S-355、§11.5）。`~` は連鎖の全体に掛かり、連鎖の最初の `if` にだけ書く。候補は一つで、
# 連鎖の頭に `~` があれば後ろの `~` を除く形、無ければ `~` を頭の `if` へ移す形。`~` が被演算子に接するときは、
# 前置の `~` の読み（`!d`）を二つ目に並べる。一つの連鎖に複数あれば `~` ごとの誤り（S-259）。
[[form]]
id = "else_if_tilde"
kind = "redundant"
origin = "Rust と Swift（条件ごとの印 `else if let`、`else if case`）"
stage = "syntax"
code = "E0020"
spec = ["11.5", "18.1"]
rule = "`~` は連鎖の最初の `if` にだけ書き、`else if` の連鎖の全体に掛かる"

[[form.example]]
source = '''
pub flow g(x: F32 at sample, c: Bool at sample, d: Bool at sample) -> F32 at sample {
  if~ c {
    lp~(x)
  } else if~ d {
    hp~(x)
  } else {
    x
  }
}
'''
at = "4:12"
fixed = ['''
pub flow g(x: F32 at sample, c: Bool at sample, d: Bool at sample) -> F32 at sample {
  if~ c {
    lp~(x)
  } else if d {
    hp~(x)
  } else {
    x
  }
}
''']

