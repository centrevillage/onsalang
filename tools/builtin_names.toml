# 組込みの名前の直書きの許可リスト（Q-14、rules/process.md 8.2 の 5、8.3 の 7）。検査は tools/builtin_names.py。
#
# Rust のコード（crates/ の、テストと `design/06-placement.md` の登録簿を除く所）に書かれた、組込みの名前と同じ
# 綴りの文字列リテラルの数を、ファイルと文字列ごとに許す。行番号には依存しない。表は二つ:
#   [allow."<リポジトリの根からのパス>"]           組込みの名前の直書き（判断を置き場所へ移すと減る）
#   "<リテラル>" = <数>
#   [same_spelling."<リポジトリの根からのパス>"]   綴りが同じで意味の違うもの（C のマクロ名、
#   "<リテラル>" = { count = <数>, note = "<意味>" }  @param のキー、Rust の型名など）
# 二つの表の数の和より多ければ失敗する（新しい直書き。判断は `design/06-placement.md` の置き場所に置く。
# 意味の違うものなら same_spelling に意味を添えて足す）。少なければ失敗する（数を減らす）。
# 初期値は W1-02 の時点の全て（C-118）。組込みの型のメンバーは W5-02・W5-17 で std の宣言へ移った。
# 組込みの名前の集合と、何を直書きと数えるかは tools/builtin_names.py の先頭に書いた。
# 今の中身は `tools/builtin_names.py --print` で出せる（same_spelling の項目は残し、残りを allow に
# 置く。一覧を書き換える前に差分を読むこと）。

