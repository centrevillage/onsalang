# The classes of the fix stage of the fuzzing that the spec puts outside the contract of the fix
# candidates (spec §18.1, S-236; R-207), or that an R records as a low harm left as it is (rules/leader.md
# 4.5). The gate item `fuzz` (tools/fuzz.py) takes a mutant that shows
# a class listed here with the message listed with it as known for good. The input of an entry must
# show them on every run, and no class that is not listed here or in tests/fuzz/left_seen.txt: when it
# no longer does, the entry goes (the input stays as a regression input). Only the classes of the fix
# stage (`fix|<code>|<title>|<code left>`) are listed; a crash or a signal never is. The contract itself
# is checked on the cases (onsa_tests::fix_contract).
# A class with an error left (its last part is a code) no longer fails the gate (X-25, rules/checks.md 4.4):
# an entry of such a class only keeps its mutants out of the list `tools/fuzz.py left` prints. Such a
# class of an input with two errors (S-384, S-413) is not listed here: it goes to tests/fuzz/left_seen.txt
# (`tools/fuzz.py left --seen`), which the replay of the saved inputs reads too, and its input stays as a
# regression input.
#
# Every field is required:
#   class    the class the fuzzing prints
#   left     the message of the diagnostic left after the candidate, written as the class writes the
#            title (quoted text `…`, code points `U+#`, numbers `#`)
#   input    the saved input that shows them, `tests/fuzz/<name>.onsa` (not listed in tests/pending.toml;
#            one entry each; another saved input that shows only classes listed here or in
#            tests/fuzz/left_seen.txt needs no entry)
#   reasons  the S numbers (`decisions/S/`) that put it outside the contract, or the R numbers (`issues/R/`)
#            that record it as a low harm left as it is (one or more)
#   note     a short note

[[allowed]]
class = "fix|E0002|make the two literals one|E0001"
left = "unknown escape; allowed: \\n \\t \\r \\# \\\\ \\\" \\' \\u{...}"
input = "tests/fuzz/8b657f17.onsa"
reasons = ["S-438", "S-388"]
note = "two closed string literals side by side, the later with an error of its own (`\\q`): the two made one keep that E0001, now in the first literal, which the candidate replaces (S-438: the merge is offered also then); the first candidate where no `,` starts an element (a struct literal's field)"

