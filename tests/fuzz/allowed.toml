# The classes of the fix stage of the fuzzing that the spec puts outside the contract of the fix
# candidates (spec §18.1, S-236; R-207). The gate item `fuzz` (tools/fuzz.py) takes a mutant that shows
# a class listed here with the message listed with it as known for good. The input of an entry must
# show them on every run, and nothing else: when it no longer does, the entry goes (the input stays as
# a regression input). Only the classes of the fix stage (`fix|<code>|<title>|<code left>`) are listed;
# a crash or a signal never is. The contract itself is checked on the cases (onsa_tests::fix_contract).
#
# Every field is required:
#   class    the class the fuzzing prints
#   left     the message of the diagnostic left after the candidate, written as the class writes the
#            title (quoted text `…`, numbers `#`)
#   input    the saved input that shows them, `tests/fuzz/<name>.onsa` (not listed in tests/pending.toml;
#            one entry each)
#   reasons  the S numbers of plan §2 that put it outside the contract (one or more)
#   note     a short note

[[allowed]]
class = "fix|E0002|write the `…` between the elements|E0020"
left = "a `…` goes between the alternatives of a pattern, not before the first"
input = "tests/fuzz/0562ac9f.onsa"
reasons = ["S-386", "S-383"]
note = "an arm without its `,` before a line that starts with `|`: the `,`, then the `|` before the first alternative (S-383), two steps as S-386 decided"

