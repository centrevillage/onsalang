# 実装待ちの一覧（計画 D-16 の 7、Q-08、§8.6 の「新しい構文のテスト」）
#
# 一覧にある対象は、まだ通らないことを期待する。通ったら gate（tools/gate.sh）が失敗し、
# 一覧から外すよう促す。意味はどの種類も同じ。外す作業は、対象を通したときに項目を消す。
#
# 項目は [[pending]] の表で、次の欄は全て必須（expect のほかの欄は書けない）:
#   kind     種類: "spec-example" | "diag-code" | "gate" | "test-case" | "fuzz-input"
#   target   対象の識別子（形は種類ごと。下）
#   reasons  理由の S / R 番号の配列（一つ以上。計画 §2 の S、レビュー §8 の R）。until = "P2" の項目に
#            限り、仕様の節（"§20" の形。仕様の番号付きの見出しにあるもの）も書ける。第 1 期の範囲は
#            仕様 §20 が定めるため
#   until    外す予定の作業 ID（docs/rework-phase1.md §3 の W の ID か、計画 §4 の T の ID）。
#            第 2 期のコードは "P2"（K-13 の規則 3。使えるのは diag-code だけ）。第 2 期のコードは計画 §5 の
#            表の M の欄が「第 2 期」の行で、それ以外のコードを P2 にすると失敗し、第 2 期のコードを
#            別の until で載せても失敗する（照合は tools/diag_codes.py）。
#            要約では段 P2 として W・M の段の後に数える。--stage-end P2 は使い方の誤りで、
#            第 1 期の終わりの --stage-end M9 は、P2 でない項目が残っていれば失敗する
#   note     短い説明
# 任意の欄:
#   expect   "internal" だけ。test-case の事例全体の項目（"::<test の名前>" の無いもの）にだけ書ける。
#            コンパイラの内部エラー（S-67）は、この一覧で黙らせられない（W1-04）。expect = "internal" の
#            項目の事例は、内部エラーで終わることを期待する。内部エラー以外で失敗したら失敗、通ったら
#            一覧から外すよう失敗にする（照合はテストの実行器）
#
# target の形:
#   spec-example  "§<節> <ハッシュ>: <先頭の行>"。仕様の ```onsa ブロックの名前。ハッシュは、
#                 照合と同じ正規化（行末の //~ と各行の前後の空白と前後の空行を除く）をした
#                 ブロックの SHA-256 の先頭 8 桁。節は直前の番号付きの見出し、先頭の行は空白を
#                 一つに詰めたもの。ブロックの内容・節・先頭の行のどれかが変わると、項目は
#                 どのブロックも指さなくなり、gate が今の名前を添えて失敗する。
#                 tools/check_spec_examples.py が、一覧に無い食い違いに正しい名前を示す。
#   diag-code     否定例がまだ 3 件に届かない診断コード: "E0812"（照合は tools/diag_codes.py、W1-02）。
#                 数えるのは、実際に走って照らし、一致した //~ のマーカだけ（mode = "none" の事例、
#                 事例ごと実装待ちの test-case "<パス>" の事例、走査の除外先は数えない）。
#                 3 件に届かないのに一覧に無いコードと、一覧にあるのに 3 件に届いたコードは失敗。
#                 外す予定の作業は K-13 の規則: 1. コードの規則を作るか変える W の作業（複数なら
#                 最後に仕上げる作業。そのテストの票が否定例を書く）、2. どの作業も触れない
#                 実装済みのコードは W1-10、3. 第 2 期のコードは "P2"
#   gate          載せてよい gate の項目の名前（tools/gate_steps.py の STEPS で pendable=True のもの。
#                 今は C の検査の c-clang、c-gcc、c-gcc-strict、c-sanitize、c-x86、c-header、
#                 c-header-strict。W1-06）。後の作業を待つ検査は、既知の原因の警告だけを外して常に回す項目
#                 （c-gcc、c-header。外す警告は onsa_tests::c::GCC_KNOWN_OFF の一か所）と、外さない項目
#                 （名前に -strict）に分け、全体を載せるのは -strict の項目だけにする（新しい誤りを隠さない）。
#                 項目の全体を載せる "c-gcc-strict" の照合は gate（tools/gate.py）が行う。項目が自分で報告する事例は
#                 "<項目>/<事例>" で、照合はその項目が行う: 載っていて落ちる事例は実装待ち、載って
#                 いて通る事例と、項目の事例を指さない項目は失敗。一つの項目を全体と事例の両方で
#                 載せると失敗。事例に当たらない誤り（コンパイラが PATH に無い、ビルドが一つも無い）は
#                 一覧で黙らせられない。C の検査の事例は "<パス>[<ターゲット>]"
#                 （"c-gcc/tests/conformance/voice.onsa[host]"）、c-header と c-header-strict は
#                 "<パス>[<ターゲット>]/<コンパイラ>"（"c-header-strict/tests/conformance/voice.onsa[host]/c++11-g++-15"。
#                 照合は onsa_tests::ccheck）。
#                 gate の完全性を保つ項目（fmt、clippy、test、仕様の例、この一覧、W1-02 の静的な
#                 検査、自己テスト）と info の項目は載せられない
#   test-case     リポジトリの根からのパス（ファイルかパッケージのディレクトリ）。
#                 一つの test だけなら "<パス>::<test の名前>"          （照合は W1-03）
#                 一つの手順の組（断片の [[test.host]]、K-14）だけなら "<パス>::<組の名前>"（W1-11）。
#                 組の名前と test の名前は事例の中で一つの名前空間（重なりは事例の誤り）。組の項目が
#                 黙らせるのはその組の手順の失敗（値の違い、手順の中でプロセスが終わった、今の C API で
#                 書けない手順）だけで、事例の誤り、器の誤り、組が走らなかったことは黙らせない
#                 組の項目は組の全ての手順の失敗を黙らせるので、項目が黙らせる範囲は組の分け方で絞る（計画 D-05 の
#                 W1-11 の実装）。落ちる原因の手順（R の誤り、今の C API で書けない手順）は、その手順と、状態を作るのに
#                 要る前の手順だけの組に置き、前の手順は実装待ちでない別の組でも照らす
#   fuzz-input    保存した入力のファイルの、リポジトリの根からのパス "tests/fuzz/<名前>.onsa"
#                 （照合は tools/fuzz.py、gate の項目 fuzz。W1-04）。保存した入力は毎回 onsa check と
#                 onsa fmt --check にかける。一覧にある入力は、まだ落ちる（内部エラー、シグナル、時間切れ）
#                 ことを期待し、落ちなければ失敗にする（項目を外し、ファイルは回帰の入力として残す）。
#                 一覧に無い保存した入力が落ちても失敗。ファズが見つけた落ち方の型が一覧の入力と同じなら
#                 既知として通し、新しい型なら最小化した入力を target/fuzz/new/ に書いて失敗にする
#                 （tools/fuzz.py --save で tests/fuzz/ に写す）
#                 パスは正規形だけ（/ で区切る。./、..、//、末尾の /、\ を含まない）
# until が完了の印（✅）の付いた作業を指す項目は失敗にする（外すか until を改める）。

